<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sky Fragment Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: directorio de vestíbulo a la izquierda, modelo al centro, ficha técnica que entra por la derecha;
   selector de vistas abajo, como en la referencia. Paleta tomada de los materiales del modelo (Night, Deep Teal, Aqua). */
:root {
  --night: #222933;
  --night-ink: #f2f5f6;
  --bg: #eef2f3;
  --panel: #fbfcfc;
  --panel-2: #f2f5f6;
  --ink: #141a21;
  --ink-2: #47525d;
  --ink-3: #6f7b86;
  --line: #dbe2e5;
  --line-2: #c5cfd4;
  --accent: #2b6675;
  --accent-soft: #dcebee;
  --sky-1: #d6e7ed;
  --sky-2: #f5f8f8;
  --use-comercio: #eb6834;
  --use-oficinas: #2a78d6;
  --use-vivienda: #1baf7a;
  --use-nucleo: #8d959c;
  --on-fill: #ffffff;
  --shadow: 0 10px 30px rgba(20, 30, 40, .14), 0 2px 6px rgba(20, 30, 40, .08);
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 320px;
  --drawer-w: 400px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --night: #0b0f13; --night-ink: #e9eef1;
    --bg: #0f1418; --panel: #161c22; --panel-2: #1c242b;
    --ink: #eef2f4; --ink-2: #b7c1c8; --ink-3: #8a96a0;
    --line: #26303a; --line-2: #34414c;
    --accent: #6fb7c8; --accent-soft: #1d3138;
    --sky-1: #1a2732; --sky-2: #0f151a;
    --use-comercio: #d95926; --use-oficinas: #3987e5; --use-vivienda: #199e70; --use-nucleo: #6f7880;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --night: #0b0f13; --night-ink: #e9eef1;
  --bg: #0f1418; --panel: #161c22; --panel-2: #1c242b;
  --ink: #eef2f4; --ink-2: #b7c1c8; --ink-3: #8a96a0;
  --line: #26303a; --line-2: #34414c;
  --accent: #6fb7c8; --accent-soft: #1d3138;
  --sky-1: #1a2732; --sky-2: #0f151a;
  --use-comercio: #d95926; --use-oficinas: #3987e5; --use-vivienda: #199e70; --use-nucleo: #6f7880;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-areas: "top top" "side stage"; }

/* ---------- barra superior */
.topbar { grid-area: top; display: flex; align-items: center; gap: 12px; min-width: 0; background: var(--night); color: var(--night-ink);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
.brand svg { flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .01em; line-height: 1; white-space: nowrap; }
.brand-sub { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-spacer { flex: 1; }
.top-btn { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid rgba(255,255,255,.22); color: var(--night-ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.top-btn:hover { background: rgba(255,255,255,.08); }
.list-btn { display: none; }

/* ---------- barra lateral (directorio) */
.side { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 3; padding-left: env(safe-area-inset-left, 0px); }
.side-head { padding: 18px 18px 10px; display: grid; gap: 4px; }
.side-title { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.05; margin: 0; text-wrap: balance; }
.side-help { color: var(--ink-2); font-size: 14px; margin: 0; }
.search { margin: 6px 16px 10px; position: relative; }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 9px 14px 9px 38px; font: inherit; font-size: 14px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.side-list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 8px 12px; }
.side-foot { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 8px; }
.foot-title { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.legend span { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; background: var(--c); }

/* elementos de lista */
.item { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; text-align: left; background: transparent; border: 0;
  border-bottom: 1px solid var(--line); padding: 10px 10px; cursor: pointer; border-radius: 0; }
.item:hover, .item.is-active { background: var(--accent-soft); }
.item .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); color: var(--accent); border: 1px solid var(--line); }
.item .t { font-weight: 600; font-size: 15px; line-height: 1.2; }
.item .s { font-size: 13px; color: var(--ink-3); }
.item .go { color: var(--ink-3); }

/* directorio de niveles */
.lvl { width: 100%; display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 10px; background: transparent; border: 0; border-bottom: 1px solid var(--line);
  padding: 7px 10px; text-align: left; cursor: pointer; }
.lvl:hover { background: var(--panel-2); }
.lvl.is-active { background: var(--accent-soft); }
.code { font-family: var(--font-data); font-size: 12.5px; font-weight: 500; background: var(--night); color: var(--night-ink); border-radius: 6px; padding: 3px 0; text-align: center; letter-spacing: .02em; }
.lvl .n { font-weight: 600; font-size: 14.5px; line-height: 1.15; }
.lvl .u { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-3); }
.lvl .u i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); display: inline-block; }
.lvl .e { font-family: var(--font-data); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.spaces { padding: 4px 10px 10px 70px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.sp { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; background: transparent; border: 0; text-align: left; padding: 5px 4px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.sp:hover { background: var(--panel); }
.sp i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); align-self: center; }
.sp b { font-weight: 500; }
.sp em { font-style: normal; font-family: var(--font-data); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* resumen de usos */
.usebar { display: flex; gap: 2px; height: 28px; margin: 4px 16px 8px; }
.usebar div { background: var(--c); border-radius: 4px; color: var(--on-fill); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; padding-left: 8px; overflow: hidden; white-space: nowrap; min-width: 0; }
.usecards { display: grid; gap: 8px; padding: 4px 8px 12px; }
.usecard { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; align-items: baseline; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; }
.usecard:hover, .usecard.is-active { border-color: var(--line-2); background: var(--panel-2); }
.usecard .sw { align-self: center; }
.usecard .t { font-weight: 600; font-size: 16px; }
.usecard .a { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
.usecard .d { grid-column: 2 / 4; font-size: 13px; color: var(--ink-3); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 16px; text-align: left; font-size: 14px; }
.note { font-size: 12.5px; color: var(--ink-3); margin: 0 16px 12px; }

/* ---------- escenario */
.stage { grid-area: stage; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 70%); min-width: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.hs { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 0; background: transparent; padding: 0; cursor: pointer; pointer-events: auto; }
.hs::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.3); transition: transform .15s; }
.hs::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--c, var(--accent)); opacity: .0; animation: pulse 2.4s ease-out infinite; }
.hs:hover::before, .hs:focus-visible::before, .hs.is-active::before { transform: scale(1.25); }
.hs .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
.hs:hover .tip, .hs:focus-visible .tip, .hs.is-active .tip, .show-tips .hs.tag .tip { opacity: 1; }
.show-tips .hs.tag .tip { font-weight: 500; font-size: 12px; padding: 2px 8px; box-shadow: none; }
.show-tips .hs.tag.below .tip { bottom: auto; top: calc(100% + 4px); }
.show-tips .hs.tag.notip:not(:hover):not(.is-active) .tip { opacity: 0; }
.show-tips .hs.tag:hover .tip, .show-tips .hs.tag.is-active .tip { font-weight: 600; box-shadow: var(--shadow); }
@keyframes pulse { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
.uselabel { position: absolute; left: 0; top: 0; transform: translateY(-50%); display: grid; grid-template-columns: 12px auto; gap: 0 8px; align-items: center; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); pointer-events: auto; cursor: pointer; white-space: nowrap; }
.uselabel b { font-size: 15px; }
.uselabel small { grid-column: 2; font-family: var(--font-data); font-size: 12px; color: var(--ink-3); }
.chips { position: absolute; top: 14px; right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: calc(100% - 28px); }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; cursor: pointer; box-shadow: var(--shadow); }
.chip[aria-pressed="true"] { background: var(--night); color: var(--night-ink); border-color: var(--night); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
.chip[aria-pressed="true"] .dot { opacity: 1; background: var(--use-vivienda); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--night); color: var(--night-ink); }
.levelbadge { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: auto auto; gap: 2px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 12px 10px 14px; box-shadow: var(--shadow); }
.levelbadge .big { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: .9; grid-row: 1 / 3; letter-spacing: .01em; }
.levelbadge .nm { font-weight: 600; font-size: 15px; }
.levelbadge .meta { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.levelbadge .meta i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); display: inline-block; }
.stepper { grid-column: 3; grid-row: 1 / 3; display: grid; gap: 4px; margin-left: 6px; }
.stepper button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.stepper button:disabled { opacity: .35; cursor: default; }
.views { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.views button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
.views button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.scalebar { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(22px, env(safe-area-inset-bottom, 0px)); font-family: var(--font-data); font-size: 11.5px; color: var(--ink-2); }
.scalebar .bar { height: 6px; border: 1.5px solid var(--ink-2); border-top: 0; margin-bottom: 3px; background: linear-gradient(90deg, var(--ink-2) 50%, transparent 50%); }
.scalebar .lbl { display: flex; justify-content: space-between; }
.picktip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--night); color: var(--night-ink); font-size: 12.5px; padding: 4px 9px; border-radius: 6px; white-space: nowrap; transform: translate(12px, 12px); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, var(--sky-1), var(--sky-2)); z-index: 5; }
.loading-card { width: min(320px, calc(100% - 32px)); display: grid; gap: 10px; text-align: center; }
.loading-card .big { font-family: var(--font-display); font-weight: 600; font-size: 34px; }
.progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.loading-card p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* ---------- ficha (drawer) */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(105%); transition: transform .28s ease; display: flex; flex-direction: column; z-index: 6; }
.drawer.open { transform: none; }
.dr-head { display: grid; grid-template-columns: 48px 1fr 40px; gap: 12px; align-items: center; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
.dr-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--accent); font-family: var(--font-data); font-weight: 500; font-size: 13px; }
.dr-ic.fill { background: var(--c); border-color: transparent; color: var(--on-fill); }
.dr-title { font-family: var(--font-display); font-weight: 600; font-size: 25px; line-height: 1.05; margin: 0; text-wrap: balance; }
.dr-sub { font-size: 13.5px; color: var(--ink-3); margin: 2px 0 0; }
.dr-close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.dr-body { overflow-y: auto; padding: 4px 20px 28px; min-height: 0; }
.dr-body h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 20px 0 8px; letter-spacing: .01em; }
.dr-body p { margin: 0 0 10px; color: var(--ink-2); max-width: 62ch; }
.badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 4px 11px; background: var(--panel-2); border: 1px solid var(--line); margin: 0 6px 6px 0; }
.badge i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
dl.kv dd.mono { font-family: var(--font-data); font-size: 13px; }
.rows { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; font-size: 14px; width: 100%; }
.row:hover { background: var(--panel-2); }
.row i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.row em { font-style: normal; font-family: var(--font-data); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.hbar { display: grid; grid-template-columns: 1fr; gap: 3px; margin: 6px 0; }
.hbar .lab { display: flex; justify-content: space-between; font-size: 13px; }
.hbar .lab em { font-style: normal; font-family: var(--font-data); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hbar .trk { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.hbar .trk div { height: 100%; border-radius: 999px; background: var(--c); }
.cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; border: 0; background: var(--night); color: var(--night-ink); border-radius: 999px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
table.lv { border-collapse: collapse; width: 100%; font-size: 13px; }
table.lv th, table.lv td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.lv th { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.lv td.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
table.lv td i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); display: inline-block; margin-right: 6px; }
.small { font-size: 12.5px; color: var(--ink-3); }

/* ---------- teléfono */
@media (max-width: 820px) {
  :root { --side-w: 0px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage"; }
  .brand-sub, .top-btn .lbl { display: none; }
  .brand-name { font-size: 20px; }
  .top-btn { padding: 6px 11px; }
  .list-btn { display: inline-flex; }
  .side { position: fixed; left: 0; right: 0; bottom: 0; height: 62%; border-right: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); padding-right: env(safe-area-inset-right, 0px);
    transform: translateY(105%); transition: transform .28s ease; z-index: 7; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .side.open { transform: none; }
  .drawer { top: auto; height: 70%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
  .drawer.open { transform: none; }
  .views { bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
  .views button { padding: 8px 12px; }
  .views button span { display: none; }
  .views button[aria-pressed="true"] span { display: inline; }
  .levelbadge .big { font-size: 30px; }
  .chips { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 60px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    max-width: none; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }

/* ================================================================ selección en 3D */
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let highlighted = null;
function clearHighlight() {
  if (highlighted) { highlighted.forEach((m) => { m.material = useMat(m.userData.dept); }); highlighted = null; requestRender(); }
}
function highlightDept(d) {
  clearHighlight();
  if (state.view !== 'usos') return;
  const ms = blockMeshes.filter((m) => m.userData.dept === d);
  const hi = useMat(d).clone(); hi.emissive.setHex(0x2a2a2a); hi.userData.hi = true;
  ms.forEach((m) => { m.material = hi; });
  highlighted = ms; requestRender();
}
function pickAt(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (state.view === 'usos') { const hit = ray.intersectObjects(blockMeshes, false)[0]; return hit ? { type: 'block', hit } : null; }
  if (state.view === 'plantas') {
    const root = groups.levels[state.level]; if (!root || !root.visible) return null;
    const hits = ray.intersectObject(root, true).filter((h) => h.point.y <= clipPlane.constant + 0.01 && !h.object.userData.poche);
    const hit = hits[0]; if (!hit) return null;
    const attr = hit.object.geometry.getAttribute('_feature_id');
    const fid = attr ? attr.getX(hit.face.a) : -1;
    const f = root.userData.features[fid];
    return f ? { type: 'element', f, fid } : null;
  }
  return null;
}
const pickTip = $('#pickTip'); let pickT = 0;
function hidePick() { pickTip.hidden = true; }
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  const now = performance.now(); if (now - pickT < 60) return; pickT = now;
  const p = pickAt(e.clientX, e.clientY);
  if (!p) { hidePick(); canvas.style.cursor = ''; return; }
  const r = stage.getBoundingClientRect();
  pickTip.style.left = (e.clientX - r.left) + 'px'; pickTip.style.top = (e.clientY - r.top) + 'px';
  if (p.type === 'block') { const L = model.levels.find((l) => l.id === p.hit.object.userData.levelId); pickTip.textContent = `${L.name} · ${DEPT_NAME[p.hit.object.userData.dept]}${p.hit.object.userData.zone ? ' · ' + m2(p.hit.object.userData.zone.area) : ''}`; }
  else pickTip.textContent = `${CAT_NAME[p.f[0]] || p.f[0]}${p.f[1] ? ' · ' + p.f[1] : ''}`;
  pickTip.hidden = false; canvas.style.cursor = 'pointer';
});
canvas.addEventListener('pointerleave', hidePick);
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const p = pickAt(e.clientX, e.clientY);
  if (!p) return;
  if (p.type === 'block') { const L = model.levels.find((l) => l.id === p.hit.object.userData.levelId); openLevel(L); }
  if (p.type === 'element') {
    const L = curLevel(); const [cat, piece, parte, oid, typ] = p.f;
    const body = `<p style="margin-top:14px">${badge(L.mixed ? 'nucleo' : L.dept, L.name)}</p>` + kv([['Category', esc(CAT_NAME[cat] || cat)], piece && ['Element', esc(piece)], parte && parte !== piece && ['Part', esc(parte)], oid && ['Model ID', esc(oid), true], typ && ['Type', esc(typ)], ['Level', `${esc(L.name)} · FFL ${npt(L.elev)} m`]]) + `<p class="small" style="margin-top:12px">Tap another interior element to see its data.</p>`;
    openDrawer({ icon: esc((CAT_NAME[cat] || '?').slice(0, 2)), title: piece || CAT_NAME[cat] || 'Element', sub: `${CAT_NAME[cat] || cat} · ${L.name}`, body, key: 'el:' + p.fid });
  }

/* ================================================================ escala gráfica (planta) */
function updateScale() {
  if ($('#scalebar').hidden) return;
  const dist = camera.position.distanceTo(controls.target);
  const pxPerM = stage.clientHeight / (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  const nice = [1, 2, 5, 10, 20, 50].find((m) => m * pxPerM >= 70) || 50;
  $('#scaleBar').style.width = Math.round(nice * pxPerM) + 'px';
  $('#scaleLbl').textContent = nice + ' m';
}

/* ================================================================ ciclo de render */
function frame() {
  requestAnimationFrame(frame);
  const moved = controls.update();
  if (moved) needsRender = true;
  if (!needsRender) return;
  needsRender = false;
  renderer.render(scene, camera);
  placeHotspots(); updateScale();
}

/* ================================================================ ruta (hash) */
let hashLock = false;
function setHash(h) { hashLock = true; if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h); hashLock = false; }
function routeFromHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('floors-')) { const c = h.slice(7).toUpperCase(); const L = model.levels.find((l) => l.code === c); return ['plantas', L ? L.id : 'N05']; }
  if (h === 'uses') return ['usos', null];
  if (h === 'floors') return ['plantas', null];
  if (h === 'exterior') return ['exterior', null];
  return ['exterior', null];
}
window.addEventListener('hashchange', () => { if (hashLock || !model) return; const [v, l] = routeFromHash(); setView(v, { level: l }); });
document.querySelectorAll('.views button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

/* ================================================================ arranque */
(async function boot() {
  try {
    const res = await fetch('data/model.json'); model = await res.json();
    readUseColors();
    progress.total = 3 + 1 + 1;
    const pShell = loadShell();
    const pPB = loadLevel('PB'), pAZ = loadLevel('AZ');
    await pShell;
    buildUses();
    const [view, level] = routeFromHash();
    camera.position.set(110, 70, 160); controls.target.set(0, 26, 0); controls.update();
    setView(view, { level, instant: true, keepDrawer: true });
    await Promise.all([pPB, pAZ]);
    if (state.view === 'exterior') { groups.levels.PB.visible = true; groups.levels.AZ.visible = true; }
    sun.shadow.needsUpdate = true; requestRender();
    $('#loading').hidden = true;
  } catch (err) {
    console.error(err);
    $('#loadingMsg').textContent = 'The model could not be loaded. Reload the page to try again.';
  }
  frame();
})();
</script>
